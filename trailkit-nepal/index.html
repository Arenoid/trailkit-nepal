<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta 
  name = "description"
  content="TrailKit Nepal: Your trekking buddy apparently.">

  <meta name = "theme-color" content = "#f7f7f2">

  <title>TrailKit Nepal | Online Companion (for now)</title>
</head>
<body>
  <div class = "application-layout">
    <aside class = "application-sidebar">
      <a href = "#" class = "brand-link" aria-label="TrailKit Nepal Home">
        <span class = "brand-link_icon">▲</span>

        <span class = "brand-link_name">TrailKit</span class = brand-link_suffix>.nepal</span>
      </span>
      </a>

      <h2 class = "sidebar-section-heading"> WORKSPACE </h2>
      <nav class = "primary-navigation" aria-label = "main-navigation">
        <a href = "#" class = "navigation-link navigation-link--active">
          <span class = "navigation-link__icon">⌂</span>
          <span>Overview</span>
        </a>

        <a href = "#gear" class = "navigation-link">
          <span class = "navigation-link_icon">▤</span>
          <span>Gear Library</span>
        </a>

        <a href = "#journal" class = "navigation-link">
          <span class = "navigation-link__icon">▧</span>
          <span>Adventure Journal</span>
        </a>
      </nav>

      <div class = "side_bar-footer">
        <div class = "offline-stats">
          <span class = "offline-status_indicatior"></span>
          <div class = "offline-stats__details">
            <strong class = "offline-status_title">
              Offline Ready
            </strong>

            <small class = "offline-status__description">
              Your trails, Your data.
            </small>
          </div>
        </div>

        <p class = "sidebar-footer__caption">
          MADE FOR THE TRAILS OF NEPAL
        </p>
      </div>
    </aside>


    <main class = "dashboard-content">
      <header class = "page-header">
        <div>
          <span class = "section-eyebrow">
            YOUR OUTDOOR COMPANION
          </span>

          <h1 class = "page-header__title">
            Adventure Begins Here!
          </h1>
        </div>

        <div
        class = "current-date"
        id = "current-date">
      </div>
      </header>

      <section class = "welcome-banner">
        <div class = "welcome-baner__content">
          <span class = "welcome-banner__tag">
            ✳ BUILT FOR THE OUTDOORS
          </span>

          
        </div>
      </section>
    </main>
  </div>
  
</body>
</html>
